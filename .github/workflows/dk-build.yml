name: DK build (Windows sciter)
# D.K SYSTEM 원격 서비스 — RustDesk Sciter 32bit 단일 exe 빌드. 체크아웃 직후 우리 서버/키를 config.rs 에 박는다.
# RustDesk 공식 flutter-build.yml 의 build-for-windows-sciter 잡을 그대로 옮기고, 서명/릴리스 단계를 제거했다.
on:
  workflow_dispatch:

env:
  LLVM_VERSION: "15.0.6"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VERSION: "dk"
  UPLOAD_ARTIFACT: "true"
  SIGN_BASE_URL: "-2"
  # D.K 자가호스팅 RustDesk 서버 (VM101, KT 공인 IP 포트포워딩). 나중에 rd.1517.kr 로 교체.
  DK_SERVER: "61.79.41.153"
  DK_KEY: "VlJ64Dlsuf4EQdQKtSLEx3JBDU0JnT2gd1HOdt5Xp3M="

jobs:
  build-for-windows-sciter:
    name: ${{ matrix.job.target }} (${{ matrix.job.os }})
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          - {
              target: i686-pc-windows-msvc,
              os: windows-2022,
              arch: x86,
              vcpkg-triplet: x86-windows-static,
            }
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Bake D.K server, key and branding
        shell: bash
        run: |
          f=libs/hbb_common/src/config.rs
          # 1) 서버/키
          sed -i "s/rs-ny\.rustdesk\.com/${DK_SERVER}/g" "$f"
          sed -i "s#OeVuKk5nlHiXp+APNn0Y3pC1Iwpwn44JGqrQCsWqmBw=#${DK_KEY}#g" "$f"
          # 2) 앱 이름 (창 제목·폴더·로그) → D.K
          sed -i 's/RwLock::new("RustDesk".to_owned())/RwLock::new("D.K SYSTEM 원격 서비스".to_owned())/' "$f"
          # 3) Windows 실행 파일 속성 (파일 속성·작업관리자 설명)
          sed -i 's/ProductName = "RustDesk"/ProductName = "D.K SYSTEM 원격 서비스"/' Cargo.toml
          sed -i 's/FileDescription = "RustDesk Remote Desktop"/FileDescription = "D.K SYSTEM 원격 서비스"/' Cargo.toml
          sed -i 's/OriginalFilename = "rustdesk.exe"/OriginalFilename = "DK-Remote-Support.exe"/' Cargo.toml
          echo "== after patch =="
          grep -nE "RENDEZVOUS_SERVERS|RS_PUB_KEY|APP_NAME" "$f" | head
          grep -nE "ProductName|FileDescription|OriginalFilename" Cargo.toml | head

      - name: Install LLVM and Clang
        uses: rustdesk-org/install-llvm-action-32bit@6aa7d9ad3df84dff01cd4596dd0fc880a7f47fce # no release tag; commit 2026-05-26
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install nightly-2023-10-13-${{ matrix.job.target }} \
            --target ${{ matrix.job.target }} --component rustfmt \
            --profile minimal --no-self-update --force-non-host
          rustup default nightly-2023-10-13-${{ matrix.job.target }} --force-non-host

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: ${{ matrix.job.os }}-sciter

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: ${{ matrix.job.vcpkg-triplet }}
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet ${{ matrix.job.vcpkg-triplet }} \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"; echo "======"; cat "$_1"; echo "======"; echo ""
            done
            exit 1
          fi
        shell: bash

      - name: Build rustdesk
        id: build
        shell: bash
        run: |
          python3 res/inline-sciter.py
          sed -i 's/branch = "dyn"/branch = "dyn_x86"/g' ./Cargo.toml
          cargo update -p sciter-rs --precise 674e07d3066ca9a92ced3816203ab6b652629d1e
          cargo build --locked --features inline,vram,hwcodec --release --bins
          mkdir -p ./Release
          mv ./target/release/rustdesk.exe ./Release/rustdesk.exe
          curl -LJ -o ./Release/sciter.dll https://github.com/c-smile/sciter-sdk/raw/master/bin.win/x32/sciter.dll
          curl -LJ -o ./usbmmidd_v2.zip https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip
          unzip usbmmidd_v2.zip
          rm -rf ./usbmmidd_v2/deviceinstaller.exe ./usbmmidd_v2/usbmmidd.bat
          mv ./usbmmidd_v2 ./Release || true

      - name: Build self-extracted executable
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../Release/ -o . -e ../../Release/rustdesk.exe
          popd
          mkdir -p ./SignOutput
          mv ./target/release/rustdesk-portable-packer.exe ./SignOutput/DK-Remote-${{ env.VERSION }}-${{ matrix.job.arch }}.exe

      - name: Upload portable exe
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dk-remote-windows-${{ matrix.job.arch }}
          path: SignOutput
